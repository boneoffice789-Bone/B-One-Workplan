<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-One Engineering - Daily Task Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /*
         * ຖ້າຕ້ອງການໃຊ້ font Phetsarath OT ແບບຝັງ: ເອົາແຖວ @font-face ເດີມຂອງທ່ານມາວາງບ່ອນນີ້
         * (ບໍ່ວາງກໍໄດ້ ລະບົບຈະໃຊ້ Noto Sans Lao ຈາກ Google Fonts ແທນ)
         */
        :root {
            --primary-color: #cc0000;
            --primary-dark: #990000;
            --bg-color: #f4f6f9;
            --text-dark: #0f172a;
            --text-card-detail: #1e293b;
            --card-radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        .app-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 0;
            border-bottom: 4px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .brand-title { font-weight: 700; letter-spacing: 0.5px; color: #ffffff; font-size: 1.4rem; }
        .logo-badge { background:#fff; border-radius:12px; padding:6px 10px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
        .logo-badge img { height:64px; width:auto; display:block; }
        .brand-subtitle { font-size: 0.9rem; color: #ffe6e6; font-weight: 400; }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: var(--card-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            background-color: #ffffff;
            overflow: hidden;
        }

        .task-card {
            border: none;
            border-left: 6px solid var(--primary-color);
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.02);
        }

        .task-detail-text { color: var(--text-card-detail) !important; font-weight: 500; }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .btn-modern { border-radius: 10px; padding: 10px 20px; font-weight: 600; font-size: 0.95rem; }

        .btn-action {
            width: 36px; height: 36px;
            border-radius: 50% !important;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; border: none;
            background-color: #f1f5f9; color: var(--text-dark);
            transition: all 0.2s;
        }
        .btn-action:hover { transform: scale(1.1); }
        .btn-action-success:hover { background-color: #dcfce7; color: #15803d; }
        .btn-action-warning:hover { background-color: #fef9c3; color: #a16207; }
        .btn-action-danger:hover { background-color: #fee2e2; color: #b91c1c; }
        .btn-action-carry:hover { background-color: #dbeafe; color: #1d4ed8; }

        .progress { height: 12px; border-radius: 20px; background-color: #ef4444; overflow: hidden; }
        .progress-bar-done { background: linear-gradient(90deg, #22c55e, #4ade80); height: 100%; }

        .badge-modern {
            padding: 6px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .badge-today { background-color: #fee2e2; color: #b91c1c; }
        .badge-tomorrow { background-color: #dbeafe; color: #1d4ed8; }

        .expected-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            font-weight: 700;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .carry-note-box {
            background-color: #eff6ff !important;
            border-left: 4px solid #1d4ed8 !important;
            color: #1e40af !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-radius: 8px !important;
            margin: 12px 0 0 0 !important;
        }
        .normal-note-box {
            background-color: #f1f5f9 !important;
            border-left: 4px solid #64748b !important;
            color: #1e293b !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-radius: 8px !important;
            margin: 12px 0 0 0 !important;
        }

        .member-checkbox-group {
            max-height: 150px; overflow-y: auto; -webkit-overflow-scrolling: touch;
            border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; background: #fff;
        }

        .swal2-popup { font-family: 'Phetsarath OT', 'Noto Sans Lao', sans-serif !important; border-radius: 16px !important; }
        #loadingSpinner { display: none; text-align: center; margin: 40px 0; color: var(--primary-color); }

        /* ===== ປັບປຸງສຳລັບມືຖື ===== */
        .form-control, .form-select, .input-group-text { font-size: 16px; } /* ກັນ iOS zoom ເອງ */
        input[type="date"].form-control { min-height: 44px; background: #fff; -webkit-appearance: none; appearance: none; }
        .member-checkbox { width: 1.2em; height: 1.2em; }
        .btn-action { width: 44px; height: 44px; }
        .task-main { flex: 1 1 auto; min-width: 0; word-break: break-word; }
        .action-btns { flex-shrink: 0; }
        @media (max-width: 576px) {
            .task-top { flex-direction: column; }
            .action-btns { width: 100%; justify-content: flex-end; border-top: 1px solid #f1f5f9; padding-top: 8px; }
            .app-header .btn-group { width: 100%; }
            .app-header .btn-group .btn { flex: 1; padding-top: 10px; padding-bottom: 10px; }
            .brand-title { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <header class="app-header mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center">
                <div class="logo-badge me-3" id="logoBadge"><img id="headerLogo" alt="B-One Engineering"></div>
                <div>
                    <h4 class="brand-title mb-0">B-ONE ENGINEERING</h4>
                    <div class="brand-subtitle">ລະບົບຈັດການຕາຕະລາງເຮັດວຽກປະຈຳວັນ</div>
                </div>
            </div>

            <div class="btn-group rounded-3 shadow-sm overflow-hidden" role="group">
                <button class="btn btn-success btn-sm fw-bold px-3" onclick="exportToExcel()"><i class="fa-solid fa-file-excel me-1"></i> Excel</button>
                <button class="btn btn-light btn-sm fw-bold px-3 text-danger" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf me-1"></i> PDF</button>
                <button class="btn btn-warning btn-sm fw-bold px-3 text-dark" onclick="exportToJPEG()"><i class="fa-solid fa-file-image me-1"></i> JPEG</button>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3 d-flex align-items-center gap-2" style="color: var(--text-dark);">
                    <i class="fa-solid fa-circle-plus text-danger"></i> <span id="formTitle">ເພີ່ມໜ້າວຽກໃໝ່</span>
                </h6>
                <form id="taskForm" class="row g-3">
                    <input type="hidden" id="editTaskId">
                    <div class="col-md-8">
                        <label class="form-label text-secondary small fw-bold">ຊື່ລາຍການວຽກ *</label>
                        <input type="text" id="taskName" class="form-control" placeholder="ພິມລາຍລະອຽດໜ້າວຽກ..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-bold">ປະເພດແຜນວຽກ *</label>
                        <select id="taskType" class="form-select" required>
                            <option value="today" selected>ວຽກປະຈຳວັນ (ມື້ນີ້)</option>
                            <option value="tomorrow">ແຜນວຽກມື້ຕໍ່ໄປ</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">ຫົວໜ້າທີມ</label>
                        <select id="taskLeader" class="form-select">
                            <option value="">-- ເລືອກຫົວໜ້າທີມ --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">ລູກທີມ (ເລືອກໄດ້ຫຼາຍຊື່)</label>
                        <div id="taskMembersContainer" class="member-checkbox-group">
                            <span class="text-muted small">ກຳລັງໂຫຼດລາຍຊື່...</span>
                        </div>
                    </div>

                    <div class="col-md-3 col-6"><label class="form-label text-secondary small fw-bold">ມື້ເລີ່ມວຽກ</label><input type="date" id="taskStartDate" class="form-control"></div>
                    <div class="col-md-3 col-6"><label class="form-label text-secondary small fw-bold">ມື້ຕ້ອງສຳເລັດ</label><input type="date" id="taskDate" class="form-control"></div>
                    <div class="col-md-3 col-6">
                        <label class="form-label text-secondary small fw-bold">ຄາດວ່າມື້ອື່ນຈະສຳເລັດ (%)</label>
                        <div class="input-group">
                            <input type="number" id="taskExpected" class="form-control" min="0" max="100" step="1" inputmode="numeric" placeholder="0 - 100">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label text-secondary small fw-bold">ສຳເລັດຕົວຈິງ (%)</label>
                        <div class="input-group">
                            <input type="number" id="taskDone" class="form-control" min="0" max="100" step="1" inputmode="numeric" placeholder="0 - 100">
                            <span class="input-group-text">%</span>
                        </div>
                    </div>
                    <div class="col-12"><label class="form-label text-secondary small fw-bold">ໝາຍເຫດ</label><input type="text" id="taskNote" class="form-control" placeholder="ໝາຍເຫດເພີ່ມເຕີມ..."></div>
                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-light btn-modern me-2" id="cancelEditBtn" style="display: none;" onclick="cancelEdit()">ຍົກເລີກ</button>
                        <button type="submit" class="btn btn-danger btn-modern px-4 shadow-sm" id="saveBtn" style="background-color: var(--primary-color);">
                            <i class="fa-solid fa-paper-plane me-1"></i> ບັນທຶກລົງ Sheet
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold m-0 text-secondary">
                <i class="fa-solid fa-folder-open me-1"></i> ຕາຕະລາງແຜນວຽກທັງໝົດ (<span id="todayDate"></span>)
            </h6>
            <span class="badge rounded-pill bg-secondary bg-opacity-10 text-secondary px-3 py-2 fw-bold" id="taskCount">ກຳລັງໂຫຼດ...</span>
        </div>

        <div id="loadingSpinner">
            <div class="spinner-border spinner-border-sm" role="status"></div>
            <p class="mt-2 small fw-bold">ກຳລັງຊິງຄ໌ຂໍ້ມູນ...</p>
        </div>
        <div id="taskList"></div>
    </div>

        const HAS_LOGO = LOGO_DATA.indexOf('data:image') === 0;

        let allTasks = [];
        let leaderList = [];
        let memberList = [];
        let isSaving = false;
        let pendingNewId = null;   // ກັນເພີ່ມຊ້ຳເມື່ອກົດບັນທຶກຄືນ

        /* ================= ວັນທີ (ຄົງທີ່ ບໍ່ຂຶ້ນກັບເຂດເວລາຂອງເຄື່ອງ) ================= */
        const LAOS_OFFSET_MIN = 7 * 60;   // ລາວ UTC+7

        function pad2(n) { return String(n).padStart(2, '0'); }
        function dateToLaosInput(d) {
            const t = new Date(d.getTime() + LAOS_OFFSET_MIN * 60000);
            return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate());
        }
        function toInputDate(v) {
            if (v === null || v === undefined || v === '') return '';
            if (v instanceof Date) return isNaN(v.getTime()) ? '' : dateToLaosInput(v);
            const s = String(v).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);          // dd/mm/yyyy
            if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
            if (/^\d{4}-\d{2}-\d{2}[ T][\d:.]+$/.test(s)) return s.slice(0, 10);       // ບໍ່ມີ timezone
            const d = new Date(s.replace(' ', 'T'));                                    // Safari ບໍ່ອ່ານຍະຫວ່າງ
            return isNaN(d.getTime()) ? '' : dateToLaosInput(d);
        }
        function formatShortDate(v) {
            const s = toInputDate(v);
            if (!s) return '-';
            const [y, m, d] = s.split('-');
            return `${d}/${m}/${y}`;
        }
        function addDays(inputDate, days) {
            const [y, m, d] = inputDate.split('-').map(Number);
            const t = new Date(Date.UTC(y, m - 1, d + days));
            return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate());
        }

        const todayStr = formatShortDate(new Date());
        const fileDate = () => todayStr.replace(/\//g, '-');
        document.getElementById('todayDate').innerText = todayStr;

        if (HAS_LOGO) {
            document.getElementById('headerLogo').src = LOGO_DATA;
            const fav = document.createElement('link');
            fav.rel = 'icon'; fav.type = 'image/png'; fav.href = LOGO_DATA;
            document.head.appendChild(fav);
        } else {
            document.getElementById('logoBadge').style.display = 'none';
        }

        /* ================= ຕົວຊ່ວຍທົ່ວໄປ ================= */
        function esc(s) {
            return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        function showNotification(title, icon = 'success') {
            Swal.fire({
                title: title, icon: icon, toast: true, position: 'top-end',
                showConfirmButton: false, timer: 3000, timerProgressBar: true
            });
        }
        function showBusy(title, text) {
            Swal.fire({ title, text: text || '', allowOutsideClick: false, allowEscapeKey: false,
                        showConfirmButton: false, didOpen: () => Swal.showLoading() });
        }

        /* ================= ໝາຍເຫດ: tag ພິເສດ ================= */
        function parseNote(raw) {
            raw = raw || '';
            const isTomorrow = raw.includes('[TOMORROW_PLAN]');
            const m = raw.match(/\[EXPECT:(\d{1,3})\]/);
            const expected = m ? Math.min(100, parseInt(m[1], 10)) : null;
            const text = raw.replace('[TOMORROW_PLAN]', '').replace(/\[EXPECT:\d{1,3}\]/, '').replace(/\s+/g, ' ').trim();
            return { isTomorrow, expected, text, isCarry: text.includes('[ອີງໃສ່ວຽກເກົ່າ') };
        }
        function buildNote(isTomorrow, expected, text) {
            let out = '';
            if (isTomorrow) out += '[TOMORROW_PLAN] ';
            if (expected !== null && expected !== '' && !isNaN(expected)) out += `[EXPECT:${expected}] `;
            return (out + (text || '')).trim();
        }

        /* ================= ອ່ານ / ບັນທຶກ ແບບປອດໄພ ================= */
        async function fetchWithTimeout(url, options, ms) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), ms || 25000);
            try { return await fetch(url, Object.assign({}, options, { signal: ctrl.signal })); }
            finally { clearTimeout(timer); }
        }

        function normalizeTask(t) {
            const done = Math.max(0, Math.min(100, Number(t.doneProgress) || 0));
            return Object.assign({}, t, {
                id: Number(t.id),
                startDate: toInputDate(t.startDate),
                date: toInputDate(t.date),
                doneProgress: done,
                pendingProgress: 100 - done
            });
        }

        async function readFromSheet() {
            // ?_=timestamp + no-store ກັນ iOS Safari ໃຊ້ cache ເກົ່າ
            const res = await fetchWithTimeout(SCRIPT_URL + '?action=read&_=' + Date.now(),
                { method: 'GET', redirect: 'follow', cache: 'no-store' }, 25000);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();   // ຖ້າໄດ້ໜ້າ login ຂອງ Google ຈະ error ຕອນນີ້
            return {
                tasks: (data.tasks || []).map(normalizeTask),
                leaders: data.leaders || [],
                members: data.members || []
            };
        }

        async function postToSheet(list) {
            await fetchWithTimeout(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(list)
            }, 45000);
        }

        function sig(t) { return [t.id, t.name, t.doneProgress, t.startDate, t.date].join('|'); }
        function sameData(a, b) {
            if (a.length !== b.length) return false;
            const mb = new Map(b.map(t => [String(t.id), sig(t)]));
            return a.every(t => mb.get(String(t.id)) === sig(t));
        }

        function applyServerState(state) {
            allTasks = state.tasks; leaderList = state.leaders; memberList = state.members;
            setupTeamDropdowns();
            renderTasks();
        }

        function friendlyError(err) {
            if (!navigator.onLine) return 'ບໍ່ມີອິນເຕີເນັດ ກະລຸນາກວດສັນຍານແລ້ວລອງໃໝ່';
            if (err && err.name === 'AbortError') return 'ເຊີບເວີຕອບຊ້າເກີນໄປ ກະລຸນາລອງໃໝ່';
            if (err && err.message === 'verify-failed')
                return 'ສົ່ງຂໍ້ມູນແລ້ວ ແຕ່ຢືນຢັນບໍ່ໄດ້ວ່າເຂົ້າ Sheet ຂໍ້ມູນໃນຟອມຍັງຢູ່ ກົດບັນທຶກອີກຄັ້ງໄດ້ (ຈະບໍ່ຊ້ຳ)';
            return 'ເຊື່ອມຕໍ່ Google Sheet ບໍ່ໄດ້. ຖ້າເປີດຜ່ານ LINE/Facebook/WhatsApp ໃຫ້ເປີດດ້ວຍ Safari ຫຼື Chrome';
        }

        /* ອ່ານຂໍ້ມູນລ່າສຸດ -> ໃຊ້ການປ່ຽນແປງ -> ສົ່ງ -> ອ່ານກັບມາກວດ */
        async function commitChange(mutator) {
            if (isSaving) { showNotification('ກຳລັງບັນທຶກ ກະລຸນາລໍຖ້າ...', 'info'); return false; }
            isSaving = true;
            document.getElementById('saveBtn').disabled = true;
            showBusy('ກຳລັງບັນທຶກ...', 'ກະລຸນາຢ່າປິດໜ້າ ຫຼື ສະຫຼັບໄປແອັບອື່ນ');
            try {
                const fresh = await readFromSheet();          // ຖ້າອ່ານບໍ່ໄດ້ -> ຢຸດ ບໍ່ຂຽນທັບ
                const next = mutator(fresh.tasks.slice());
                let ok = false, check = null;
                for (let attempt = 1; attempt <= 3 && !ok; attempt++) {
                    await postToSheet(next);
                    await sleep(700 * attempt);
                    try { check = await readFromSheet(); ok = sameData(next, check.tasks); }
                    catch (e) { ok = false; }
                }
                if (!ok) throw new Error('verify-failed');
                applyServerState(check);
                Swal.close();
                showNotification('ບັນທຶກສຳເລັດ!');
                return true;
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'ບັນທຶກບໍ່ສຳເລັດ', text: friendlyError(err), confirmButtonText: 'ຕົກລົງ' });
                return false;
            } finally {
                isSaving = false;
                document.getElementById('saveBtn').disabled = false;
            }
        }

        async function loadTasks() {
            document.getElementById('loadingSpinner').style.display = 'block';
            try {
                applyServerState(await readFromSheet());
            } catch (error) {
                console.error(error);
                if (!allTasks.length) {
                    document.getElementById('taskCount').innerText = '-';
                    document.getElementById('taskList').innerHTML =
                        `<div class="card border-0 p-4 text-center"><p class="mb-3 text-danger fw-bold">${esc(friendlyError(error))}</p>
                         <button class="btn btn-danger btn-modern" onclick="loadTasks()"><i class="fa-solid fa-rotate me-1"></i> ລອງໃໝ່</button></div>`;
                }
                showNotification('ບໍ່ສາມາດດຶງຂໍ້ມູນໄດ້!', 'error');
            }
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        // ກັບມາຈາກແອັບອື່ນ -> ໂຫຼດຂໍ້ມູນໃໝ່ (ຖ້າບໍ່ໄດ້ກຳລັງພິມຟອມ)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' || isSaving) return;
            if (document.getElementById('editTaskId').value || document.getElementById('taskName').value) return;
            loadTasks();
        });

        /* ================= ທີມງານ ================= */
        function setupTeamDropdowns() {
            const prevMembers = getSelectedMembers();
            const leaderSelect = document.getElementById('taskLeader');
            const currentLeader = leaderSelect.value;
            leaderSelect.innerHTML = '<option value="">-- ເລືອກຫົວໜ້າທີມ --</option>';
            leaderList.forEach(name => {
                leaderSelect.innerHTML += `<option value="${esc(name)}">${esc(name)}</option>`;
            });
            if (currentLeader) leaderSelect.value = currentLeader;

            const membersContainer = document.getElementById('taskMembersContainer');
            membersContainer.innerHTML = '';
            if (memberList.length === 0) {
                membersContainer.innerHTML = '<span class="text-muted small">ບໍ່ມີລາຍຊື່ລູກທີມໃນ Sheet Team</span>';
                return;
            }
            memberList.forEach((name, idx) => {
                membersContainer.innerHTML += `
                    <div class="form-check">
                        <input class="form-check-input member-checkbox" type="checkbox" value="${esc(name)}" id="mbr_${idx}">
                        <label class="form-check-label small fw-bold" for="mbr_${idx}">${esc(name)}</label>
                    </div>`;
            });
            setSelectedMembers(prevMembers);
        }

        function splitMembers(str) {
            return String(str || '').split(/\s*[,，]\s*/).map(s => s.trim()).filter(Boolean);
        }

        function getSelectedMembers() {
            const checked = document.querySelectorAll('.member-checkbox:checked');
            return Array.from(checked).map(cb => cb.value).join(', ');
        }

        function setSelectedMembers(membersStr) {
            document.querySelectorAll('.member-checkbox').forEach(cb => cb.checked = false);
            if (!membersStr) return;
            const arr = splitMembers(membersStr);
            document.querySelectorAll('.member-checkbox').forEach(cb => { if (arr.includes(cb.value)) cb.checked = true; });
        }

        /* ================= ສະແດງລາຍການ ================= */
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
            document.getElementById('taskCount').innerText = `${allTasks.length} ໜ້າວຽກ`;

                taskList.innerHTML = '<div class="text-center p-5 text-muted card border-0 bg-white">📭 ບໍ່ມີໜ້າວຽກໃນລະບົບ</div>';

            }

            allTasks.forEach((task, index) => {

                }

                const expectedHtml = note.expected !== null
                    ? `<div class="expected-box"><i class="fa-solid fa-bullseye"></i> ຄາດວ່າມື້ອື່ນຈະສຳເລັດ ${note.expected}%</div>`
                    : '';

                let noteHtml = '';

                    noteHtml = `<p class="${noteClass}"><i class="fa-solid fa-circle-exclamation me-1"></i> <b>ໝາຍເຫດ:</b> ${esc(note.text)}</p>`;
                }

                card.innerHTML = `
                    <div class="card-body p-4">

                                <div class="mb-2">${typeBadge}</div>
                                <h6 class="fw-bold mb-2 text-dark" style="font-size: 1.05rem; line-height: 1.5;">${index + 1}. ${esc(task.name)}</h6>
                                <div class="row g-2 small mb-2">
                                    <div class="col-6 task-detail-text"><i class="fa-solid fa-user-tie me-1"></i> <b>ຫົວໜ້າ:</b> ${esc(task.leader || '-')}</div>
                                    <div class="col-6 task-detail-text"><i class="fa-solid fa-users me-1"></i> <b>ລູກທີມ:</b> ${esc(task.members || '-')}</div>
                                    <div class="col-12 text-danger fw-bold mt-1">
                                        <i class="fa-solid fa-calendar-days me-1"></i> <b>ໄລຍະເວລາ:</b> ${formatShortDate(task.startDate)} ຫາ ${formatShortDate(task.date)}
                                    </div>
                                </div>
                            </div>
                            <div class="action-btns d-flex gap-1">
                                ${carryForwardBtn}
                                <button class="btn btn-action btn-action-success" onclick="updateProgress(${task.id})" title="ອັບເດດ"><i class="fa-solid fa-check"></i></button>
                                <button class="btn btn-action btn-action-warning" onclick="editTask(${task.id})" title="ແກ້ໄຂ"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-action btn-action-danger" onclick="deleteTask(${task.id})" title="ລົບ"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="mt-3 pt-2 border-top border-light">
                            <div class="d-flex justify-content-between mb-1 small fw-bold">
                                <span class="text-success">ແລ້ວ ${task.doneProgress}%</span>
                                <span class="text-danger">ຍັງ ${task.pendingProgress}%</span>
                            </div>

                                <div class="progress-bar progress-bar-done" style="width: ${task.doneProgress}%"></div>

        /* ================= ສືບຕໍ່ວຽກ / ເພີ່ມ / ແກ້ໄຂ / ລົບ / ອັບເດດ % ================= */
        function carryForwardTask(id) {
            const originTask = allTasks.find(t => t.id === id);
            if (!originTask) return;

            Swal.fire({
                title: 'ຢືນຢັນການສືບຕໍ່ວຽກ?',
                text: `ທ່ານຕ້ອງການສືບຕໍ່ວຽກ "${originTask.name}" ໄປເປັນແຜນວຽກມື້ຕໍ່ໄປບໍ່?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#cc0000', cancelButtonColor: '#64748b',
                confirmButtonText: 'ເຈົ້າ, ສືບຕໍ່ວຽກ', cancelButtonText: 'ຍົກເລີກ'
            }).then(async (result) => {
                if (!result.isConfirmed) return;
                const old = parseNote(originTask.note);

                // ເລີ່ມ = ມື້ເລີ່ມເກົ່າ + 1 ມື້, ກຳນົດສຳເລັດ = ເທົ່າເກົ່າ
                const oldStart = toInputDate(originTask.startDate);
                const oldEnd = toInputDate(originTask.date);
                const calculatedStartDate = oldStart ? addDays(oldStart, 1) : '';
                let calculatedEndDate = oldEnd;
                if (calculatedStartDate && calculatedEndDate && calculatedStartDate > calculatedEndDate) {
                    calculatedEndDate = calculatedStartDate;
                }

                const carryText = (old.text ? old.text + ' ' : '') + `[ອີງໃສ່ວຽກເກົ່າເຮັດໄດ້ ${originTask.doneProgress}%]`;

                const newTask = {
                    id: Date.now(),
                    name: originTask.name + " (ສືບຕໍ່ວຽກ)",
                    leader: originTask.leader, members: originTask.members,
                    startDate: calculatedStartDate,
                    date: calculatedEndDate,
                    note: buildNote(true, old.expected, carryText),
                    doneProgress: originTask.doneProgress, pendingProgress: originTask.pendingProgress
                };

                await commitChange(list => {
                    if (!list.some(t => t.id === newTask.id)) list.push(newTask);
                    return list;
                });
            });
        }

        document.getElementById('taskForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = this;
            const editId = document.getElementById('editTaskId').value;
            const isTomorrow = document.getElementById('taskType').value === 'tomorrow';
            const clamp = v => v === '' ? null : Math.max(0, Math.min(100, parseInt(v, 10) || 0));
            const expected = clamp(document.getElementById('taskExpected').value);
            const doneVal = clamp(document.getElementById('taskDone').value);
            const startDate = document.getElementById('taskStartDate').value;
            const endDate = document.getElementById('taskDate').value;

            if (startDate && endDate && startDate > endDate) {
                Swal.fire({ icon: 'warning', title: 'ມື້ເລີ່ມວຽກຕ້ອງບໍ່ເກີນມື້ຕ້ອງສຳເລັດ', confirmButtonText: 'ຕົກລົງ' });
                return;
            }

            const noteText = parseNote(document.getElementById('taskNote').value).text;
            const base = {
                name: document.getElementById('taskName').value.trim(),
                leader: document.getElementById('taskLeader').value,
                members: getSelectedMembers(),
                startDate: startDate,
                date: endDate,
                note: buildNote(isTomorrow, expected, noteText)
            };
            const targetId = editId ? Number(editId) : (pendingNewId = pendingNewId || Date.now());

            const ok = await commitChange(list => {
                const i = list.findIndex(t => t.id === targetId);
                const done = doneVal !== null ? doneVal : (i >= 0 ? list[i].doneProgress : 0);
                const item = Object.assign({}, base, { id: targetId, doneProgress: done, pendingProgress: 100 - done });
                if (i >= 0) list[i] = item; else list.push(item);
                return list;
            });

            // ຟອມ reset ຕໍ່ເມື່ອບັນທຶກສຳເລັດເທົ່ານັ້ນ
            if (ok) {
                pendingNewId = null;
                if (editId) cancelEdit();
                else { form.reset(); setSelectedMembers(''); }
            }
        });

        function deleteTask(id) {
            Swal.fire({
                title: 'ທ່ານແນ່ໃຈບໍ່?', text: "ຕ້ອງການລົບລາຍການນີ້ແທ້ບໍ່?", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#cc0000', cancelButtonColor: '#64748b',
                confirmButtonText: 'ລົບເລີຍ', cancelButtonText: 'ຍົກເລີກ'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await commitChange(list => list.filter(t => t.id !== id));
                }
            });
        }

        function editTask(id) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;
            const note = parseNote(task.note);
            document.getElementById('editTaskId').value = task.id;
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskLeader').value = task.leader || '';
            setSelectedMembers(task.members || '');
            document.getElementById('taskStartDate').value = toInputDate(task.startDate);
            document.getElementById('taskDate').value = toInputDate(task.date);
            document.getElementById('taskType').value = note.isTomorrow ? 'tomorrow' : 'today';
            document.getElementById('taskExpected').value = note.expected !== null ? note.expected : '';
            document.getElementById('taskDone').value = (task.doneProgress !== undefined && task.doneProgress !== '') ? task.doneProgress : '';
            document.getElementById('taskNote').value = note.text;
            document.getElementById('formTitle').innerText = "ແກ້ໄຂໜ້າວຽກ";
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> ອັບເດດລົງ Sheet';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            window.scrollTo(0, 0);
        }

        function cancelEdit() {
            pendingNewId = null;
            document.getElementById('taskForm').reset();
            setSelectedMembers('');
            document.getElementById('editTaskId').value = '';
            document.getElementById('formTitle').innerText = "ເພີ່ມໜ້າວຽກໃໝ່";
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> ບັນທຶກລົງ Sheet';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        async function updateProgress(id) {
            const taskIndex = allTasks.findIndex(t => t.id === id);
            if (taskIndex < 0) return;
            const { value: newProgress } = await Swal.fire({
                title: 'ອັບເດດຄວາມຄືບໜ້າ',
                text: `ໃສ່ຕົວເລກເປີເຊັນ (0-100) ສຳລັບໜ້າວຽກ: "${allTasks[taskIndex].name}"`,
                input: 'number', inputValue: allTasks[taskIndex].doneProgress,
                inputAttributes: { min: 0, max: 100, step: 1, inputmode: 'numeric' },
                showCancelButton: true, confirmButtonColor: '#22c55e', confirmButtonText: 'ບັນທຶກ', cancelButtonText: 'ຍົກເລີກ',
                inputValidator: (value) => { if (value === '' || value < 0 || value > 100) { return 'ກະລຸນາປ້ອນຕົວເລກ 0 ຫາ 100 ເທົ່ານັ້ນ!' } }
            });
            if (newProgress !== undefined && newProgress !== '') {
                const p = Math.max(0, Math.min(100, parseInt(newProgress, 10) || 0));
                await commitChange(list => {
                    const t = list.find(x => x.id === id);
                    if (t) { t.doneProgress = p; t.pendingProgress = 100 - p; }
                    return list;
                });
            }
        }

        /* ================= ລາຍງານ PDF / JPEG ================= */
        const REPORT_FONT = "'Phetsarath OT','Noto Sans Lao',sans-serif";

        function reportRowHtml(t, i) {
            const note = parseNote(t.note);
            const typeText = note.isTomorrow
                ? '<span style="color:#0056b3; font-weight:bold;">[ແຜນວຽກມື້ຕໍ່ໄປ]</span>'
                : '<span style="color:#cc0000; font-weight:bold;">[ວຽກປະຈຳວັນ]</span>';

            let memberListHtml = '';
            const memberArray = splitMembers(t.members);
            if (memberArray.length) {
                memberArray.forEach((m, k) => { memberListHtml += `<div style="padding-left: 10px;">${k + 1}. ${esc(m)}</div>`; });
            } else { memberListHtml = '<span style="color:#999;">- ບໍ່ມີ -</span>'; }

            const expectedCell = note.expected !== null
                ? `<span style="color:#1d4ed8;">${note.expected}%</span>`
                : '<span style="color:#999;">-</span>';

            let noteCell = '<span style="color:#999;">-</span>';
            if (note.text) {
                const bg = note.isCarry ? '#eff6ff' : '#f1f5f9';
                const bd = note.isCarry ? '#1d4ed8' : '#64748b';
                const tx = note.isCarry ? '#1e40af' : '#1e293b';
                noteCell = `<div style="background-color:${bg}; padding:6px 8px; border-left:4px solid ${bd}; color:${tx}; font-size:12px; font-weight:bold; border-radius:4px;">${esc(note.text)}</div>`;
            }

            return `
                    <tr style="background-color: ${i % 2 === 0 ? '#ffffff' : '#f8fafc'};">
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${i + 1}</td>
                        <td style="padding: 10px; border: 1px solid #cbd5e1; vertical-align: top;">
                            <div style="margin-bottom:2px; font-size:11px;">${typeText}</div>
                            <div style="font-weight: bold; color: #111; font-size: 14px;">${esc(t.name)}</div>
                        </td>
                        <td style="padding: 10px; border: 1px solid #cbd5e1; vertical-align: top;">
                            <div style="background-color: #f1f5f9; padding: 2px 6px; font-weight: bold; border-left: 3px solid #334155; margin-bottom: 5px;">ຫົວໜ້າທີມ: ${esc(t.leader || '-')}</div>
                            <div style="font-weight: bold; color: #475569; margin-bottom: 2px; font-size:12px;">ລູກທີມ:</div>
                            <div style="font-size:12px; color:#334155;">${memberListHtml}</div>
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: top; font-size: 13px; font-weight: 500;">
                            ${formatShortDate(t.startDate)}<br><span style="color:#64748b; font-size:11px;">ຫາ</span><br>${formatShortDate(t.date)}
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; font-weight: bold; font-size: 14px;">
                            ${expectedCell}
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; font-weight: bold; font-size: 14px;">
                            <span style="color: #22c55e;">ແລ້ວ ${t.doneProgress}%</span><br>
                            <span style="color: #ef4444; font-size: 12px;">ຍັງ ${t.pendingProgress}%</span>
                        </td>
                        <td style="padding: 10px 8px; border: 1px solid #cbd5e1; vertical-align: top; font-size: 12px;">
                            ${noteCell}
                        </td>
                    </tr>`;
        }

        function reportSignatureHtml() {
            return `<div data-part="sig" style="margin-top: 40px; display: flex; justify-content: space-between; font-size: 14px; font-family: ${REPORT_FONT}; padding: 0 10px;">
                    <div style="text-align: center; width: 220px;"><p style="margin-bottom: 45px; font-weight: bold;">ຜູ້ລາຍງານ</p><p style="border-top: 1px solid #64748b; padding-top: 5px; color:#475569;">( ............................................ )</p></div>
                    <div style="text-align: center; width: 220px;"><p style="margin-bottom: 45px; font-weight: bold;">ຜູ້ກວດກາ / ຜູ້ອານຸມັດ</p><p style="border-top: 1px solid #64748b; padding-top: 5px; color:#475569;">( ............................................ )</p></div>
                </div>`;
        }

        // ລາຍງານໜ້າດຽວຍາວ (ໃຊ້ກັບ JPEG)
        function generateReportHTML() {
            const rows = allTasks.map((t, i) => reportRowHtml(t, i)).join('');
            return reportTopHtml() + reportTableOpen() + reportTheadHtml() + `<tbody>${rows}</tbody></table>` + reportSignatureHtml();
        }

        // ລາຍງານແບ່ງໜ້າ A4 ແນວນອນ ທຸກໜ້າມີຫົວຕາຕະລາງ ແລະ ບໍ່ຕັດແຖວກາງໜ້າ (ໃຊ້ກັບ PDF)
        const PDF_W = 1110;
        const PDF_PAGE_H = Math.floor(PDF_W * 194 / 281 * 0.94);

        function buildPagedReportHTML() {
            const pageH = PDF_PAGE_H;
            const padTop = 20;
            const usable = pageH - padTop;
            const pageStyle = `box-sizing:border-box; width:${PDF_W}px; padding:${padTop}px 25px 0 25px; background:#fff; font-family:${REPORT_FONT}; line-height:1.6; letter-spacing:0;`;

            const rowsHtml = allTasks.map((t, i) => reportRowHtml(t, i)).join('');
            const probe = document.createElement('div');
            probe.style.cssText = `position:absolute; left:-99999px; top:0; ${pageStyle}`;
            probe.innerHTML = reportTopHtml() + reportTableOpen() + reportTheadHtml() + `<tbody>${rowsHtml}</tbody></table>` + reportSignatureHtml();
            document.body.appendChild(probe);
            const topH = probe.querySelector('[data-part="top"]').getBoundingClientRect().height + 20;
            const theadH = probe.querySelector('thead').getBoundingClientRect().height;
            const rowHs = Array.from(probe.querySelectorAll('tbody tr')).map(r => r.getBoundingClientRect().height);
            const sigH = probe.querySelector('[data-part="sig"]').getBoundingClientRect().height + 40;
            document.body.removeChild(probe);

            const pages = [[]];
            let used = topH + theadH;
            rowHs.forEach((h, i) => {
                if (used + h > usable && pages[pages.length - 1].length > 0) {
                    pages.push([]);
                    used = theadH;
                }
                pages[pages.length - 1].push(i);
                used += h;
            });
            const sigOwnPage = used + sigH > usable;

            const totalPages = pages.length + (sigOwnPage ? 1 : 0);
            let html = '';
            pages.forEach((idxs, p) => {
                const isLast = p === totalPages - 1;
                const rows = idxs.map(i => reportRowHtml(allTasks[i], i)).join('');
                html += `<div style="${pageStyle} ${isLast ? '' : 'page-break-after: always;'}">`
                      + (p === 0 ? reportTopHtml() : '')
                      + reportTableOpen() + reportTheadHtml() + `<tbody>${rows}</tbody></table>`
                      + ((p === pages.length - 1 && !sigOwnPage) ? reportSignatureHtml() : '')
                      + `</div>`;
            });
            if (sigOwnPage) {
                html += `<div style="${pageStyle}">${reportSignatureHtml()}</div>`;
            }
            return html;
        }

        async function ensureFonts() {
            try {
                await Promise.all(['400', '700'].map(w => document.fonts.load(`${w} 14px "Noto Sans Lao"`, 'ກຂຄງ')));
                await document.fonts.ready;
            } catch (e) { /* ignore */ }
        }

        /* ລໍໃຫ້ຮູບ (ໂລໂກ້) ໂຫຼດຄົບກ່ອນຖ່າຍລາຍງານ */
        async function waitImages(root) {
            const imgs = Array.from(root.querySelectorAll('img'));
            await Promise.all(imgs.map(img => (img.complete && img.naturalWidth)
                ? Promise.resolve()
                : new Promise(r => { img.onload = img.onerror = r; setTimeout(r, 4000); })));
        }

        /* ================= ສົ່ງອອກ (ໃຊ້ໄດ້ໃນມືຖື) ================= */
        const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

        function limitScale(w, h, want) {          // iOS canvas ຈຳກັດ ~16.7 ລ້ານ pixel
            const s = Math.sqrt(12e6 / (w * h));
            return Math.max(0.6, Math.min(want, s));
        }
        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.style.display = 'none';
            document.body.appendChild(a); a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 60000);
        }
        function deliverFile(blob, filename) {
            if (!isTouch) { triggerDownload(blob, filename); showNotification('ດາວໂຫຼດສຳເລັດ!'); return; }
            // iOS ຕ້ອງໃຫ້ຜູ້ໃຊ້ກົດປຸ່ມເອງ ຈຶ່ງເປີດ Share ໄດ້
            Swal.fire({
                icon: 'success', title: 'ສ້າງໄຟລ໌ສຳເລັດ', text: filename,
                showCancelButton: true, confirmButtonText: 'ບັນທຶກ / ແຊຣ໌', cancelButtonText: 'ປິດ', confirmButtonColor: '#cc0000',
                preConfirm: () => {
                    let file = null;
                    try { file = new File([blob], filename, { type: blob.type }); } catch (e) {}
                    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: filename })
                            .catch(err => { if (err && err.name !== 'AbortError') triggerDownload(blob, filename); });
                    } else { triggerDownload(blob, filename); }
                }
            });
        }

        function exportToExcel() {
            const exportData = allTasks.map((t, index) => {
                const note = parseNote(t.note);
                return {
                    "#": index + 1,
                    "ປະເພດວຽກ": note.isTomorrow ? 'ແຜນວຽກມື້ຕໍ່ໄປ' : 'ວຽກປະຈຳວັນ',
                    "ລາຍການວຽກ": t.name, "ຫົວໜ້າທີມ": t.leader, "ລູກທີມ": t.members,
                    "% ຄາດວ່າຈະສຳເລັດມື້ອື່ນ": note.expected !== null ? note.expected : '',
                    "% ຄວາມຄືບໜ້າ": t.doneProgress, "ຍັງຄ້າງ (%)": t.pendingProgress,
                    "ມື້ເລີ່ມວຽກ": formatShortDate(t.startDate), "ມື້ກຳນົດສົ່ງ": formatShortDate(t.date),
                    "ໝາຍເຫດ": note.text
                };
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Database");
            const out = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            deliverFile(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
                        `B-One_Data_${fileDate()}.xlsx`);
        }

        async function exportToPDF() {
            showBusy('ກຳລັງສ້າງ PDF...');
            await ensureFonts();
            try {
                const reportDiv = document.createElement('div');
                reportDiv.style.cssText = `font-family:${REPORT_FONT};width:${PDF_W}px;background:#fff;`;
                reportDiv.innerHTML = buildPagedReportHTML();
                const holder = document.createElement('div');
                holder.style.cssText = 'position:absolute;left:-99999px;top:0;';
                holder.appendChild(reportDiv); document.body.appendChild(holder);
                await waitImages(reportDiv);
                holder.removeChild(reportDiv); holder.remove();
                const pages = reportDiv.children.length || 1;
                const scale = limitScale(PDF_W, pages * PDF_PAGE_H, 2);
                const blob = await html2pdf().set({
                    margin: [8, 8, 8, 8],
                    pagebreak: { mode: ['css'] },
                    html2canvas: { scale, useCORS: true, logging: false, windowWidth: PDF_W, scrollX: 0, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                }).from(reportDiv).outputPdf('blob');
                Swal.close();
                deliverFile(blob, `Report_B_One_${fileDate()}.pdf`);
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'ສ້າງ PDF ບໍ່ສຳເລັດ', text: 'ລອງໃໝ່ ຫຼື ໃຊ້ Excel ແທນ', confirmButtonText: 'ຕົກລົງ' });
            }
        }

        async function exportToJPEG() {
            showBusy('ກຳລັງສ້າງຮູບ...');
            await ensureFonts();
            const W = 1190;
            const wrap = document.createElement('div');
            wrap.id = 'jpegReportWrap';
            wrap.style.cssText = `position:absolute;left:-10000px;top:0;width:${W}px;padding:35px;box-sizing:border-box;background:#fff;font-family:${REPORT_FONT};line-height:1.6;`;
            wrap.innerHTML = generateReportHTML();
            document.body.appendChild(wrap);
            try {
                await waitImages(wrap);
                await sleep(150);
                const scale = limitScale(W, wrap.offsetHeight, 2);
                const canvas = await html2canvas(wrap, {
                    scale, useCORS: true, backgroundColor: '#ffffff', windowWidth: W, scrollX: 0, scrollY: 0,
                    onclone: doc => { const el = doc.getElementById('jpegReportWrap'); if (el) el.style.left = '0'; }
                });
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
                if (!blob) throw new Error('canvas-empty');
                Swal.close();
                deliverFile(blob, `Report_B_One_${fileDate()}.jpeg`);
            } catch (err) {
                console.error(err);
                Swal.fire({ icon: 'error', title: 'ສ້າງຮູບບໍ່ສຳເລັດ', text: 'ຂໍ້ມູນຫຼາຍເກີນໄປສຳລັບມືຖື ລອງໃຊ້ PDF ຫຼື Excel ແທນ', confirmButtonText: 'ຕົກລົງ' });
            } finally { wrap.remove(); }
        }

        loadTasks();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
