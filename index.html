    <style>
        :root {
            --primary-color: #cc0000;
            --primary-dark: #990000;
            --bg-color: #f4f6f9;
            --text-dark: #0f172a;
            --text-card-detail: #1e293b;
            --card-radius: 16px;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Noto Sans Lao Looped', 'Noto Sans Lao', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 0;
            border-bottom: 4px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .brand-title { font-weight: 700; letter-spacing: 0.5px; color: #ffffff; font-size: 1.4rem; }
        .logo-badge { background:#fff; border-radius:12px; padding:6px 10px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
        .logo-badge img { height:52px; width:auto; display:block; }
        .brand-subtitle { font-size: 0.9rem; color: #ffe6e6; font-weight: 400; }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: var(--card-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            background-color: #ffffff;
            overflow: hidden;
        }

        .task-card {
            border: none;
            border-left: 6px solid var(--primary-color);
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.02);
        }

        .task-detail-text { color: var(--text-card-detail) !important; font-weight: 500; }

        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.95rem;
        }

        .btn-modern { border-radius: 10px; padding: 10px 20px; font-weight: 600; font-size: 0.95rem; }

        .btn-action {
            width: 36px; height: 36px;
            border-radius: 50% !important;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; border: none;
            background-color: #f1f5f9; color: var(--text-dark);
            transition: all 0.2s;
        }
        .btn-action:hover { transform: scale(1.1); }
        .btn-action-success:hover { background-color: #dcfce7; color: #15803d; }
        .btn-action-warning:hover { background-color: #fef9c3; color: #a16207; }
        .btn-action-danger:hover { background-color: #fee2e2; color: #b91c1c; }
        .btn-action-carry:hover { background-color: #dbeafe; color: #1d4ed8; }

        .progress { height: 12px; border-radius: 20px; background-color: #ef4444; overflow: hidden; }
        .progress-bar-done { background: linear-gradient(90deg, #22c55e, #4ade80); height: 100%; }

        .badge-modern {
            padding: 6px 12px; border-radius: 30px; font-size: 0.75rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .badge-today { background-color: #fee2e2; color: #b91c1c; }
        .badge-tomorrow { background-color: #dbeafe; color: #1d4ed8; }

        /* ຄາດວ່າຈະສຳເລັດ */
        .expected-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            font-weight: 700;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .carry-note-box {
            background-color: #eff6ff !important;
            border-left: 4px solid #1d4ed8 !important;
            color: #1e40af !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-radius: 8px !important;
            margin: 12px 0 0 0 !important;
        }
        .normal-note-box {
            background-color: #f1f5f9 !important;
            border-left: 4px solid #64748b !important;
            color: #1e293b !important;
            font-weight: 600 !important;
            padding: 8px 12px !important;
            border-radius: 8px !important;
            margin: 12px 0 0 0 !important;
        }

        .member-checkbox-group {
            max-height: 150px; overflow-y: auto;
            border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; background: #fff;
        }

        .swal2-popup { font-family: 'Noto Sans Lao Looped', 'Noto Sans Lao', sans-serif !important; border-radius: 16px !important; }
        #loadingSpinner { display: none; text-align: center; margin: 40px 0; color: var(--primary-color); }
    </style>
</head>
<body>

    <header class="app-header mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center">
                <div class="logo-badge me-3"><img id="headerLogo" alt="B-One Engineering"></div>
                <div>
                    <h4 class="brand-title mb-0">B-ONE ENGINEERING</h4>
                    <div class="brand-subtitle">ລະບົບຈັດການຕາຕະລາງເຮັດວຽກປະຈຳວັນ</div>
                </div>
            </div>

            <div class="btn-group rounded-3 shadow-sm overflow-hidden" role="group">
                <button class="btn btn-success btn-sm fw-bold px-3" onclick="exportToExcel()"><i class="fa-solid fa-file-excel me-1"></i> Excel</button>
                <button class="btn btn-light btn-sm fw-bold px-3 text-danger" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf me-1"></i> PDF</button>
                <button class="btn btn-warning btn-sm fw-bold px-3 text-dark" onclick="exportToJPEG()"><i class="fa-solid fa-file-image me-1"></i> JPEG</button>
            </div>
        </div>
    </header>

    <div class="container pb-5">
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3 d-flex align-items-center gap-2" style="color: var(--text-dark);">
                    <i class="fa-solid fa-circle-plus text-danger"></i> <span id="formTitle">ເພີ່ມໜ້າວຽກໃໝ່</span>
                </h6>
                <form id="taskForm" class="row g-3">
                    <input type="hidden" id="editTaskId">
                    <div class="col-md-8">
                        <label class="form-label text-secondary small fw-bold">ຊື່ລາຍການວຽກ *</label>
                        <input type="text" id="taskName" class="form-control" placeholder="ພິມລາຍລະອຽດໜ້າວຽກ..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-bold">ປະເພດແຜນວຽກ *</label>
                        <select id="taskType" class="form-select" required>
                            <option value="today" selected>ວຽກປະຈຳວັນ (ມື້ນີ້)</option>
                            <option value="tomorrow">ແຜນວຽກມື້ຕໍ່ໄປ</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-bold">ຫົວໜ້າທີມ</label>
                        <select id="taskLeader" class="form-select">
                            <option value="">-- ເລືອກຫົວໜ້າທີມ --</option>
                        </select>
                    </div>
                    <div class="col-md-6">

        let allTasks = [];
        let leaderList = [];
        let memberList = [];
        const todayStr = new Date().toLocaleDateString('en-GB');
        document.getElementById('todayDate').innerText = todayStr;
        document.getElementById('headerLogo').src = LOGO_DATA;

        /* ============================================================
           ວັນທີ: ແກ້ບັນຫາວັນທີ່ຖອຍຫຼັງ 1 ມື້
           ສາເຫດ: Sheet ສົ່ງວັນທີ່ກັບມາເປັນ ISO (UTC) ເຊັ່ນ 2026-10-30T17:00:00.000Z
           ເຊິ່ງຖ້າຕັດດ້ວຍ split('T') ຈະໄດ້ມື້ກ່ອນໜ້າ. ຕອນນີ້ປ່ຽນເປັນເວລາທ້ອງຖິ່ນກ່ອນ.
           ============================================================ */
        function pad2(n) { return String(n).padStart(2, '0'); }

        // ຄືນຄ່າ yyyy-mm-dd (ເວລາທ້ອງຖິ່ນ) ສຳລັບ <input type="date">
        function toInputDate(v) {
            if (!v) return '';
            if (v instanceof Date) {
                return v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
            }
            const s = String(v).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const d = new Date(s);
            if (isNaN(d.getTime())) return '';
            return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
        }

        // ສະແດງເປັນ dd/mm/yyyy
        function formatShortDate(v) {
            const s = toInputDate(v);
            if (!s) return '-';
            const [y, m, d] = s.split('-');
            return `${d}/${m}/${y}`;
        }

        // ບວກມື້ (ໃຊ້ເວລາທ້ອງຖິ່ນ ບໍ່ຜ່ານ toISOString)
        function addDays(inputDate, days) {
            const [y, m, d] = inputDate.split('-').map(Number);
            return toInputDate(new Date(y, m - 1, d + days));
        }

        /* ============================================================
           ໝາຍເຫດ: ເກັບ tag ພິເສດໃນຊ່ອງ note ເດີມ (ບໍ່ຕ້ອງແກ້ Apps Script)
           [TOMORROW_PLAN]  = ແຜນວຽກມື້ຕໍ່ໄປ
           [EXPECT:xx]      = ຄາດວ່າມື້ອື່ນຈະສຳເລັດ xx%
           ============================================================ */
        function parseNote(raw) {
            raw = raw || '';
            const isTomorrow = raw.includes('[TOMORROW_PLAN]');
            const m = raw.match(/\[EXPECT:(\d{1,3})\]/);
            const expected = m ? Math.min(100, parseInt(m[1], 10)) : null;
            const text = raw.replace('[TOMORROW_PLAN]', '').replace(/\[EXPECT:\d{1,3}\]/, '').replace(/\s+/g, ' ').trim();
            return { isTomorrow, expected, text, isCarry: text.includes('[ອີງໃສ່ວຽກເກົ່າ') };
        }

        function buildNote(isTomorrow, expected, text) {
            let out = '';
            if (isTomorrow) out += '[TOMORROW_PLAN] ';
            if (expected !== null && expected !== '' && !isNaN(expected)) out += `[EXPECT:${expected}] `;
            return (out + (text || '')).trim();
        }

        function showNotification(title, icon = 'success') {
            Swal.fire({
                title: title, icon: icon, toast: true, position: 'top-end',
                showConfirmButton: false, timer: 3000, timerProgressBar: true
            });
        }

        async function loadTasks() {
            document.getElementById('loadingSpinner').style.display = 'block';
            try {
                const response = await fetch(SCRIPT_URL + '?action=read', { method: 'GET', redirect: 'follow' });

                // ປ່ຽນວັນທີ່ທັງໝົດເປັນ yyyy-mm-dd (ເວລາທ້ອງຖິ່ນ) ທັນທີທີ່ໂຫຼດ
                allTasks = (resData.tasks || []).map(t => ({
                    ...t,
                    startDate: toInputDate(t.startDate),
                    date: toInputDate(t.date)
                }));
                leaderList = resData.leaders || [];
                memberList = resData.members || [];

                setupTeamDropdowns();
                renderTasks();
            } catch (error) {
                console.error("Error:", error);
                showNotification("ບໍ່ສາມາດດຶງຂໍ້ມູນໄດ້!", 'error');
            }
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function setupTeamDropdowns() {
            const leaderSelect = document.getElementById('taskLeader');
            const currentLeader = leaderSelect.value;
            leaderSelect.innerHTML = '<option value="">-- ເລືອກຫົວໜ້າທີມ --</option>';
            leaderList.forEach(name => {
                leaderSelect.innerHTML += `<option value="${name}">${name}</option>`;
            });
            if (currentLeader) leaderSelect.value = currentLeader;

            const membersContainer = document.getElementById('taskMembersContainer');
            membersContainer.innerHTML = '';
            if (memberList.length === 0) {
                membersContainer.innerHTML = '<span class="text-muted small">ບໍ່ມີລາຍຊື່ລູກທີມໃນ Sheet Team</span>';
                return;
            }
            memberList.forEach((name, idx) => {
                membersContainer.innerHTML += `
                    <div class="form-check">
                        <input class="form-check-input member-checkbox" type="checkbox" value="${name}" id="mbr_${idx}">
                        <label class="form-check-label small fw-bold" for="mbr_${idx}">${name}</label>
                    </div>`;
            });
        }

        function getSelectedMembers() {
            const checked = document.querySelectorAll('.member-checkbox:checked');
            return Array.from(checked).map(cb => cb.value).join(', ');
        }

        function setSelectedMembers(membersStr) {
            document.querySelectorAll('.member-checkbox').forEach(cb => cb.checked = false);
            if (!membersStr) return;
            const arr = membersStr.split(/[,，\s]+/);
            document.querySelectorAll('.member-checkbox').forEach(cb => {
                if (arr.includes(cb.value)) cb.checked = true;
            });
        }

        async function saveToGoogleSheet() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ກຳລັງຊິງຄ໌...';
            saveBtn.disabled = true;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(allTasks)
                });
                showNotification("ຊິງຄ໌ຂໍ້ມູນກັບ Sheet ສຳເລັດ!");
                await loadTasks();
            } catch (error) {
                console.error("Error:", error);
                showNotification("ເກີດຂໍ້ຜິດພາດ!", 'error');
            }
            saveBtn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> ບັນທຶກລົງ Sheet';
            saveBtn.disabled = false;
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
            document.getElementById('taskCount').innerText = `${allTasks.length} ໜ້າວຽກ`;

            if (allTasks.length === 0) {
                taskList.innerHTML = '<div class="text-center p-5 text-muted card border-0 bg-white">📭 ບໍ່ມີໜ້າວຽກໃນລະບົບ</div>';
                return;
            }

            allTasks.forEach((task, index) => {
                const card = document.createElement('div');
                card.className = 'card task-card';

                const note = parseNote(task.note);
                const typeBadge = note.isTomorrow
                    ? '<span class="badge-modern badge-tomorrow"><i class="fa-solid fa-clock"></i> ແຜນວຽກມື້ຕໍ່ໄປ</span>'
                    : '<span class="badge-modern badge-today"><i class="fa-solid fa-bolt"></i> ວຽກປະຈຳວັນ</span>';

                let carryForwardBtn = '';
                if (task.doneProgress < 100) {
                    carryForwardBtn = `<button class="btn btn-action btn-action-carry" onclick="carryForwardTask(${task.id})" title="ສືບຕໍ່ວຽກນີ້"><i class="fa-solid fa-arrows-spin"></i></button>`;
                }

                const expectedHtml = note.expected !== null
                    ? `<div class="expected-box"><i class="fa-solid fa-bullseye"></i> ຄາດວ່າມື້ອື່ນຈະສຳເລັດ ${note.expected}%</div>`
                    : '';

                // ໝາຍເຫດ ແຍກອອກມາຢູ່ຊ່ອງສຸດທ້າຍຂອງກາດ
                let noteHtml = '';
                if (note.text) {
                    const noteClass = note.isCarry ? "carry-note-box" : "normal-note-box";
                    noteHtml = `<p class="${noteClass}"><i class="fa-solid fa-circle-exclamation me-1"></i> <b>ໝາຍເຫດ:</b> ${note.text}</p>`;
                }

                card.innerHTML = `
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <div class="w-70">
                                <div class="mb-2">${typeBadge}</div>
                                <h6 class="fw-bold mb-2 text-dark" style="font-size: 1.05rem; line-height: 1.5;">${index + 1}. ${task.name}</h6>
                                <div class="row g-2 small mb-2">
                                    <div class="col-6 task-detail-text"><i class="fa-solid fa-user-tie me-1"></i> <b>ຫົວໜ້າ:</b> ${task.leader || '-'}</div>
                                    <div class="col-6 task-detail-text"><i class="fa-solid fa-users me-1"></i> <b>ລູກທີມ:</b> ${task.members || '-'}</div>
                                    <div class="col-12 text-danger fw-bold mt-1">
                                        <i class="fa-solid fa-calendar-days me-1"></i> <b>ໄລຍະເວລາ:</b> ${formatShortDate(task.startDate)} ຫາ ${formatShortDate(task.date)}
                                    </div>
                                </div>
                            </div>
                            <div class="action-btns d-flex gap-1">
                                ${carryForwardBtn}
                                <button class="btn btn-action btn-action-success" onclick="updateProgress(${task.id})" title="ອັບເດດ"><i class="fa-solid fa-check"></i></button>
                                <button class="btn btn-action btn-action-warning" onclick="editTask(${task.id})" title="ແກ້ໄຂ"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-action btn-action-danger" onclick="deleteTask(${task.id})" title="ລົບ"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="mt-3 pt-2 border-top border-light">
                            <div class="d-flex justify-content-between mb-1 small fw-bold">
                                <span class="text-success">ແລ້ວ ${task.doneProgress}%</span>
                                <span class="text-danger">ຍັງ ${task.pendingProgress}%</span>
                            </div>
                            <div class="progress">
                                <div class="progress-bar progress-bar-done" style="width: ${task.doneProgress}%"></div>
                            </div>
                            ${expectedHtml ? `<div class="mt-2">${expectedHtml}</div>` : ''}
                            ${noteHtml}
                        </div>
                    </div>
                `;
                taskList.appendChild(card);
            });
        }

        function carryForwardTask(id) {
            const originTask = allTasks.find(t => t.id === id);
            if (!originTask) return;

            Swal.fire({
                title: 'ຢືນຢັນການສືບຕໍ່ວຽກ?',
                text: `ທ່ານຕ້ອງການສືບຕໍ່ວຽກ "${originTask.name}" ໄປເປັນແຜນວຽກມື້ຕໍ່ໄປບໍ່?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#cc0000', cancelButtonColor: '#64748b',
                confirmButtonText: 'ເຈົ້າ, ສືບຕໍ່ວຽກ', cancelButtonText: 'ຍົກເລີກ'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const old = parseNote(originTask.note);

                    // ສືບຕໍ່ວຽກ: ເລີ່ມ = ມື້ເລີ່ມເກົ່າ + 1 ມື້, ກຳນົດສຳເລັດ = ເທົ່າເກົ່າ
                    // ຕົວຢ່າງ 31/10 - 05/11  ->  01/11 - 05/11
                    const oldStart = toInputDate(originTask.startDate);
                    const oldEnd = toInputDate(originTask.date);
                    let calculatedStartDate = oldStart ? addDays(oldStart, 1) : '';
                    let calculatedEndDate = oldEnd;

                    // ຖ້າມື້ເລີ່ມໃໝ່ເກີນມື້ກຳນົດ ໃຫ້ກຳນົດສຳເລັດເທົ່າກັບມື້ເລີ່ມ
                    if (calculatedStartDate && calculatedEndDate && calculatedStartDate > calculatedEndDate) {
                        calculatedEndDate = calculatedStartDate;
                    }

                    const carryText = (old.text ? old.text + ' ' : '') + `[ອີງໃສ່ວຽກເກົ່າເຮັດໄດ້ ${originTask.doneProgress}%]`;

                    const newTask = {
                        id: Date.now(),
                        name: originTask.name + " (ສືບຕໍ່ວຽກ)",
                        leader: originTask.leader, members: originTask.members,
                        startDate: calculatedStartDate,
                        date: calculatedEndDate,
                        note: buildNote(true, old.expected, carryText),
                        doneProgress: originTask.doneProgress, pendingProgress: originTask.pendingProgress
                    };

                    allTasks.push(newTask);
                    renderTasks();
                    await saveToGoogleSheet();
                }
            });
        }

        document.getElementById('taskForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const isTomorrow = document.getElementById('taskType').value === 'tomorrow';

            let expectedRaw = document.getElementById('taskExpected').value;
            let expected = '';
            if (expectedRaw !== '') {
                expected = Math.max(0, Math.min(100, parseInt(expectedRaw, 10)));
            }

            let doneRaw = document.getElementById('taskDone').value;
            let doneVal = doneRaw === '' ? null : Math.max(0, Math.min(100, parseInt(doneRaw, 10)));

            const noteText = parseNote(document.getElementById('taskNote').value).text;
            const noteValue = buildNote(isTomorrow, expected, noteText);

            const taskData = {
                name: document.getElementById('taskName').value,
                leader: document.getElementById('taskLeader').value,
                members: getSelectedMembers(),
                startDate: document.getElementById('taskStartDate').value,
                date: document.getElementById('taskDate').value,
                note: noteValue,
            };

            if (editId) {
                const index = allTasks.findIndex(t => t.id == editId);
                taskData.id = parseInt(editId);
                taskData.doneProgress = doneVal !== null ? doneVal : allTasks[index].doneProgress;
                taskData.pendingProgress = 100 - taskData.doneProgress;
                allTasks[index] = taskData;
                cancelEdit();
            } else {
                taskData.id = Date.now(); taskData.doneProgress = doneVal !== null ? doneVal : 0; taskData.pendingProgress = 100 - taskData.doneProgress;
                allTasks.push(taskData);
            }

            renderTasks();
            await saveToGoogleSheet();
            this.reset();
            setSelectedMembers('');
        });

        function deleteTask(id) {
            Swal.fire({
                title: 'ທ່ານແນ່ໃຈບໍ່?', text: "ຕ້ອງການລົບລາຍການນີ້ແທ້ບໍ່?", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#cc0000', cancelButtonColor: '#64748b',
                confirmButtonText: 'ລົບເລີຍ', cancelButtonText: 'ຍົກເລີກ'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    allTasks = allTasks.filter(t => t.id !== id);
                    renderTasks(); await saveToGoogleSheet();
                }
            });
        }

        function editTask(id) {
            const task = allTasks.find(t => t.id === id);
            const note = parseNote(task.note);
            document.getElementById('editTaskId').value = task.id;
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskLeader').value = task.leader || '';
            setSelectedMembers(task.members || '');
            document.getElementById('taskStartDate').value = toInputDate(task.startDate);
            document.getElementById('taskDate').value = toInputDate(task.date);
            document.getElementById('taskType').value = note.isTomorrow ? 'tomorrow' : 'today';
            document.getElementById('taskExpected').value = note.expected !== null ? note.expected : '';
            document.getElementById('taskDone').value = (task.doneProgress !== undefined && task.doneProgress !== '') ? task.doneProgress : '';
            document.getElementById('taskNote').value = note.text;
            document.getElementById('formTitle').innerText = "ແກ້ໄຂໜ້າວຽກ";
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> ອັບເດດລົງ Sheet';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            window.scrollTo(0, 0);
        }

        function cancelEdit() {
            document.getElementById('taskForm').reset();
            setSelectedMembers('');
            document.getElementById('editTaskId').value = '';
            document.getElementById('formTitle').innerText = "ເພີ່ມໜ້າວຽກໃໝ່";
            document.getElementById('saveBtn').innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> ບັນທຶກລົງ Sheet';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        async function updateProgress(id) {
            const taskIndex = allTasks.findIndex(t => t.id === id);
            const { value: newProgress } = await Swal.fire({
                title: 'ອັບເດດຄວາມຄືບໜ້າ',
                text: `ໃສ່ຕົວເລກເປີເຊັນ (0-100) ສຳລັບໜ້າວຽກ: "${allTasks[taskIndex].name}"`,
                input: 'number', inputValue: allTasks[taskIndex].doneProgress,
                inputAttributes: { min: 0, max: 100, step: 1 },
                showCancelButton: true, confirmButtonColor: '#22c55e', confirmButtonText: 'ບັນທຶກ', cancelButtonText: 'ຍົກເລີກ',
                inputValidator: (value) => { if (value === '' || value < 0 || value > 100) { return 'ກະລຸນາປ້ອນຕົວເລກ 0 ຫາ 100 ເທົ່ານັ້ນ!' } }
            });
            if (newProgress !== undefined && newProgress !== '') {
                let progressInt = parseInt(newProgress, 10);
                allTasks[taskIndex].doneProgress = progressInt; allTasks[taskIndex].pendingProgress = 100 - progressInt;
                renderTasks(); await saveToGoogleSheet();
            }
        }

        /* ============================================================
           ລາຍງານ PDF / JPEG
           ຕາຕະລາງ: ລ/ດ | ລາຍການວຽກ | ທີມງານ | ເລີ່ມ-ກຳນົດ | ສະຖານະ | ຄາດວ່າມື້ອື່ນ | ໝາຍເຫດ (ຊ່ອງສຸດທ້າຍ)
           ============================================================ */
        const REPORT_FONT = "'Noto Sans Lao Looped','Noto Sans Lao',sans-serif";

        function reportTopHtml() {
            return `
                <div data-part="top" style="text-align: center; margin-bottom: 20px; border-bottom: 3px solid #cc0000; padding-bottom: 10px;">
                    <img src="${LOGO_DATA}" alt="B-One Engineering" style="height: 90px; width: auto; margin-bottom: 8px;">
                    <h4 style="margin-top: 0; font-weight: bold; font-family: ${REPORT_FONT}; font-size: 18px;">ຕາຕະລາງສະຫຼຸບແຜນງານ ແລະ ຄວາມຄືບໜ້າວຽກທັງໝົດ</h4>
                    <p style="color: #555; font-family: ${REPORT_FONT}; font-size: 14px;">ວັນທີອັບເດດ: ${todayStr}</p>
                </div>`;
        }

        function reportTableOpen() {
            return `<table style="width: 100%; border-collapse: collapse; font-size: 14px; font-family: ${REPORT_FONT};">`;
        }

        function reportTheadHtml() {
            const th = (w, label) => `<th style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: 700; line-height: 1.5; width: ${w}%;">${label}</th>`;
            return `<thead>
                        <tr style="background-color: #cc0000; color: #ffffff; font-size: 15px;">
                            ${th(5, 'ລ/ດ')}
                            ${th(25, 'ລາຍການວຽກ')}
                            ${th(17, 'ທີມງານ')}
                            ${th(12, 'ເລີ່ມ-ກຳນົດ')}
                            ${th(14, '% ຄາດວ່າຈະ<br>ສຳເລັດມື້ອື່ນ')}
                            ${th(12, '% ຄວາມ<br>ຄືບໜ້າ')}
                            ${th(15, 'ໝາຍເຫດ')}
                        </tr>
                    </thead>`;
        }

        function reportRowHtml(t, i) {
            const note = parseNote(t.note);
            const typeText = note.isTomorrow
                ? '<span style="color:#0056b3; font-weight:bold;">[ແຜນວຽກມື້ຕໍ່ໄປ]</span>'
                : '<span style="color:#cc0000; font-weight:bold;">[ວຽກປະຈຳວັນ]</span>';

            let memberListHtml = '';
            if (t.members && t.members.trim() !== '') {
                let memberArray = t.members.split(/[,，\s]+/);
                let listNum = 1;
                memberArray.forEach(m => { if (m.trim() !== '') { memberListHtml += `<div style="padding-left: 10px;">${listNum}. ${m.trim()}</div>`; listNum++; } });
            } else { memberListHtml = '<span style="color:#999;">- ບໍ່ມີ -</span>'; }

            const expectedCell = note.expected !== null
                ? `<span style="color:#1d4ed8;">${note.expected}%</span>`
                : '<span style="color:#999;">-</span>';

            let noteCell = '<span style="color:#999;">-</span>';
            if (note.text) {
                const bg = note.isCarry ? '#eff6ff' : '#f1f5f9';
                const bd = note.isCarry ? '#1d4ed8' : '#64748b';
                const tx = note.isCarry ? '#1e40af' : '#1e293b';
                noteCell = `<div style="background-color:${bg}; padding:6px 8px; border-left:4px solid ${bd}; color:${tx}; font-size:12px; font-weight:bold; border-radius:4px;">${note.text}</div>`;
            }

            return `
                    <tr style="background-color: ${i % 2 === 0 ? '#ffffff' : '#f8fafc'};">
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold;">${i + 1}</td>
                        <td style="padding: 10px; border: 1px solid #cbd5e1; vertical-align: top;">
                            <div style="margin-bottom:2px; font-size:11px;">${typeText}</div>
                            <div style="font-weight: bold; color: #111; font-size: 14px;">${t.name}</div>
                        </td>
                        <td style="padding: 10px; border: 1px solid #cbd5e1; vertical-align: top;">
                            <div style="background-color: #f1f5f9; padding: 2px 6px; font-weight: bold; border-left: 3px solid #334155; margin-bottom: 5px;">ຫົວໜ້າທີມ: ${t.leader || '-'}</div>
                            <div style="font-weight: bold; color: #475569; margin-bottom: 2px; font-size:12px;">ລູກທີມ:</div>
                            <div style="font-size:12px; color:#334155;">${memberListHtml}</div>
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: top; font-size: 13px; font-weight: 500;">
                            ${formatShortDate(t.startDate)}<br><span style="color:#64748b; font-size:11px;">ຫາ</span><br>${formatShortDate(t.date)}
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; font-weight: bold; font-size: 14px;">
                            ${expectedCell}
                        </td>
                        <td style="padding: 10px 6px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; font-weight: bold; font-size: 14px;">
                            <span style="color: #22c55e;">ແລ້ວ ${t.doneProgress}%</span><br>
                            <span style="color: #ef4444; font-size: 12px;">ຍັງ ${t.pendingProgress}%</span>
                        </td>
                        <td style="padding: 10px 8px; border: 1px solid #cbd5e1; vertical-align: top; font-size: 12px;">
                            ${noteCell}
                        </td>
                    </tr>`;
        }

        function reportSignatureHtml() {
            return `<div data-part="sig" style="margin-top: 40px; display: flex; justify-content: space-between; font-size: 14px; font-family: ${REPORT_FONT}; padding: 0 10px;">
                    <div style="text-align: center; width: 220px;"><p style="margin-bottom: 45px; font-weight: bold;">ຜູ້ລາຍງານ</p><p style="border-top: 1px solid #64748b; padding-top: 5px; color:#475569;">( ............................................ )</p></div>
                    <div style="text-align: center; width: 220px;"><p style="margin-bottom: 45px; font-weight: bold;">ຜູ້ກວດກາ / ຜູ້ອານຸມັດ</p><p style="border-top: 1px solid #64748b; padding-top: 5px; color:#475569;">( ............................................ )</p></div>
                </div>`;
        }

        // ລາຍງານໜ້າດຽວຍາວ (ໃຊ້ກັບ JPEG)
        function generateReportHTML() {
            const rows = allTasks.map((t, i) => reportRowHtml(t, i)).join('');
            return reportTopHtml() + reportTableOpen() + reportTheadHtml() + `<tbody>${rows}</tbody></table>` + reportSignatureHtml();
        }

        // ລາຍງານແບ່ງໜ້າ A4 ແນວນອນ: ທຸກໜ້າມີຫົວຕາຕະລາງ ແລະ ບໍ່ຕັດແຖວກາງໜ້າ (ໃຊ້ກັບ PDF)
        const PDF_W = 1110;   // ຄວາມກວ້າງລວມ (px) = 1060 + padding ຂ້າງລະ 25
        function buildPagedReportHTML() {
            // ຄວາມສູງໜ້າ A4 ແນວນອນ (ຂອບ 8mm): 281 x 194 mm -> ປ່ຽນເປັນ px ຕາມຄວາມກວ້າງ, ເຫຼືອໄວ້ 6% ກັນຄາດເຄື່ອນ
            const pageH = Math.floor(PDF_W * 194 / 281 * 0.94);
            const padTop = 20;
            const usable = pageH - padTop;
            const pageStyle = `box-sizing:border-box; width:${PDF_W}px; padding:${padTop}px 25px 0 25px; background:#fff; font-family:${REPORT_FONT}; line-height:1.6; letter-spacing:0;`;

            // 1) ວັດແທກຄວາມສູງຈິງຂອງແຕ່ລະສ່ວນ
            const rowsHtml = allTasks.map((t, i) => reportRowHtml(t, i)).join('');
            const probe = document.createElement('div');
            probe.style.cssText = `position:absolute; left:-99999px; top:0; ${pageStyle}`;
            probe.innerHTML = reportTopHtml() + reportTableOpen() + reportTheadHtml() + `<tbody>${rowsHtml}</tbody></table>` + reportSignatureHtml();
            document.body.appendChild(probe);
            const topH = probe.querySelector('[data-part="top"]').getBoundingClientRect().height + 20;
            const theadH = probe.querySelector('thead').getBoundingClientRect().height;
            const rowHs = Array.from(probe.querySelectorAll('tbody tr')).map(r => r.getBoundingClientRect().height);
            const sigH = probe.querySelector('[data-part="sig"]').getBoundingClientRect().height + 40;
            document.body.removeChild(probe);

            // 2) ຈັດແຖວລົງແຕ່ລະໜ້າ
            const pages = [[]];
            let used = topH + theadH;
            rowHs.forEach((h, i) => {
                if (used + h > usable && pages[pages.length - 1].length > 0) {
                    pages.push([]);
                    used = theadH;
                }
                pages[pages.length - 1].push(i);
                used += h;
            });
            const sigOwnPage = used + sigH > usable;

            // 3) ສ້າງ HTML ແຕ່ລະໜ້າ (ຫົວຕາຕະລາງຊ້ຳທຸກໜ້າ)
            const totalPages = pages.length + (sigOwnPage ? 1 : 0);
            let html = '';
            pages.forEach((idxs, p) => {
                const isLast = p === totalPages - 1;
                const rows = idxs.map(i => reportRowHtml(allTasks[i], i)).join('');
                html += `<div style="${pageStyle} ${isLast ? '' : 'page-break-after: always;'}">`
                      + (p === 0 ? reportTopHtml() : '')
                      + reportTableOpen() + reportTheadHtml() + `<tbody>${rows}</tbody></table>`
                      + ((p === pages.length - 1 && !sigOwnPage) ? reportSignatureHtml() : '')
                      + `</div>`;
            });
            if (sigOwnPage) {
                html += `<div style="${pageStyle}">${reportSignatureHtml()}</div>`;
            }
            return html;
        }

        async function ensureFonts() {
            try {
                await Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 14px "Noto Sans Lao Looped"`, 'ກຂຄງ')));
                await document.fonts.ready;
            } catch (e) { /* ignore */ }
        }

        function exportToExcel() {
            const exportData = allTasks.map((t, index) => {
                const note = parseNote(t.note);
                return {
                    "#": index + 1,
                    "ປະເພດວຽກ": note.isTomorrow ? 'ແຜນວຽກມື້ຕໍ່ໄປ' : 'ວຽກປະຈຳວັນ',
                    "ລາຍການວຽກ": t.name, "ຫົວໜ້າທີມ": t.leader, "ລູກທີມ": t.members,
                    "% ຄາດວ່າຈະສຳເລັດມື້ອື່ນ": note.expected !== null ? note.expected : '',
                    "% ຄວາມຄືບໜ້າ": t.doneProgress, "ຍັງຄ້າງ (%)": t.pendingProgress,
                    "ມື້ເລີ່ມວຽກ": formatShortDate(t.startDate), "ມື້ກຳນົດສົ່ງ": formatShortDate(t.date),
                    "ໝາຍເຫດ": note.text
                };
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Database");
            XLSX.writeFile(workbook, `B-One_Data_${todayStr.replace(/\//g, '-')}.xlsx`);
            showNotification("ດາວໂຫຼດ Excel ສຳເລັດ!");
        }

        async function exportToPDF() {
            await ensureFonts();
            const reportDiv = document.createElement('div');
            reportDiv.style.fontFamily = REPORT_FONT;
            reportDiv.style.width = PDF_W + 'px';
            reportDiv.style.backgroundColor = '#ffffff';
            reportDiv.innerHTML = buildPagedReportHTML();

            html2pdf().set({
                margin: [8, 8, 8, 8],
                filename: `Report_B_One_${todayStr}.pdf`,
                pagebreak: { mode: ['css'] },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            }).from(reportDiv).save().then(() => showNotification("ດາວໂຫຼດ PDF ສຳເລັດ!"));
        }

        async function exportToJPEG() {
            await ensureFonts();
            const reportDiv = document.createElement('div');
            reportDiv.style.fontFamily = REPORT_FONT;
            reportDiv.style.lineHeight = '1.6';
            reportDiv.style.padding = '35px';
            reportDiv.style.width = '1120px';
            reportDiv.style.backgroundColor = '#ffffff';
            reportDiv.innerHTML = generateReportHTML();
            document.body.appendChild(reportDiv);

            html2canvas(reportDiv, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Report_B_One_${todayStr}.jpeg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0); link.click();
                document.body.removeChild(reportDiv); showNotification("ດາວໂຫຼດ JPEG ສຳເລັດ!");
            });
        }

        loadTasks();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
